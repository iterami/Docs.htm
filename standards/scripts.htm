<ul>
  <li>All scripts should start with a shebang, followed by:<ul>
    <li><code>set -eux</code>
    <li>Args must be listed in a comment with example usage, or <code># No args.</code>.
  </ul>
  <li>Repos cloned via <code>git clone</code> must end with the <code>.git</code> suffix.
  </ul>
</ul>
