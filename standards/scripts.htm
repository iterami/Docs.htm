<ul>
  <li>All scripts should start with a shebang, followed by:<ul>
    <li>set -eux
    <li>Args must be listed in a comment, with example usage, or "# No args.".
  </ul>
  <li>Repos cloned via the "git clone" command must end with the ".git" suffix.
  </ul>
</ul>
