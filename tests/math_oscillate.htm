<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>math_oscillate(args) Tests</title>
<link href=../../common/css/core.css rel=stylesheet>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/<a href=../common/js/math_oscillate.htm>math_oscillate(args)</a><br>
<textarea id=input>{
  "limit": 5,
  "min": -10,
  "max": 10
}</textarea>
<table>
  <tr class=header>
    <td><button id=oscillate>Oscillate</button>
    <td><progress id=progress value=.5></progress>
  <tr>
    <td>Value
    <td><input id=value step=any type=number>
  <tr>
    <td>Previous
    <td><input id=previous step=any type=number value=0>
  <tr>
    <td>Diff
    <td><input id=diff readonly step=any type=number>
</table>

<script src=../../common/js/core.js></script>
<script src=../../common/js/math.js></script>
<script>
function oscillate(){
    const properties = JSON.parse(core_elements.input.value);
    const min = Math.abs(properties.min);
    progress.max = min + properties.max;

    const previous_value = core_elements.value.value || 0;
    const new_value = math_oscillate({
      'value': previous_value,
      ...properties,
    })

    core_ui_update({
      'ids': {
        'diff': new_value - previous_value,
        'previous': previous_value,
        'progress': min + Number(new_value),
        'value': new_value,
      },
    });
}

function repo_init(){
    core_repo_init({
      'events': {
        'oscillate': {
          'onclick': oscillate,
        },
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui_elements': [
        'input',
        'previous',
        'progress',
        'result',
        'value',
      ],
    });
}
</script>
