<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>math_oscillate(args) Tests</title>
<link href=../../common/css/core.css rel=stylesheet>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/<a href=../common/js/math_oscillate.htm>math_oscillate(args)</a><br>

<textarea id=input>
{
  "limit": 5,
  "min": -10,
  "max": 10
}
</textarea><br>
<button id=oscillate>Oscillate</button>
<table>
  <tr class=header>
    <td>Properties
    <td>Values
  <tr>
    <td>Value
    <td><input id=value step=any type=number>
  <tr>
    <td>Previous
    <td><input id=old step=any type=number value=0>
  <tr>
    <td>Diff
    <td><input id=diff readonly step=any type=number>
</table>

<script src=../../common/js/core.js></script>
<script src=../../common/js/math.js></script>
<script>
function oscillate(){
    core_elements.old.value = core_elements.value.value || 0;
    core_elements.value.value = math_oscillate({
      'value': core_elements.value.value,
      ...JSON.parse(core_elements.input.value),
    });

    core_ui_update({
      'ids': {
        'diff': core_elements.value.value - core_elements.old.value,
        'old': core_elements.old.value,
        'value': core_elements.value.value,
      },
    });
}

function repo_init(){
    core_repo_init({
      'events': {
        'oscillate': {
          'onclick': oscillate,
        },
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui_elements': [
        'old',
        'input',
        'result',
        'value',
      ],
    });
}
</script>
