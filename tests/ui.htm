<script src=../../common/js/core.js></script>
<script>
function repo_init(){
    core_repo_init({
      'events': {
        'update': {
          'onclick': update,
        },
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui-elements': [
        'values',
      ],
    });
}

function update(){
    core_ui_update({
      'class': true,
      'ids': JSON.parse(core_elements['values'].value)
    });
}
