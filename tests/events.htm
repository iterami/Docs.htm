<!doctype html>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Event Tests</title>
<link href=../../common/css/core.css rel=stylesheet>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/Events<br>
<button id=pointerLock type=button>pointerLock</button><input id=text type=text><br>
<table style="display:inline-block">
  <thead>
    <tr>
      <td>core_type(event)
      <td id=event>
    <tr>
      <td>event.type
      <td id=type>
    <tr class=header>
      <td><input checked id=check-mouse type=checkbox>Mouse
      <td>Properties
    <tr>
      <td>deltaY Wheel
      <td id=deltaY>
  <tbody id=core_mouse></tbody>
    <tr class=header>
      <td><input checked id=check-keys type=checkbox>Keys
      <td id=code>
  <tbody id=keys>
</table>
<ul id=totals style="display:inline-block;vertical-align:top"></ul>

<script src=../../common/js/core.js></script>
<script>
function repo_init(){
    core_repo_init({
      'beforeunload': {
        'todo': function(event){
            update(event);
            event.preventDefault();
        },
      },
      'globals': {
        'totals': {},
      },
      'events': {
        'pointerLock': {
          'onclick': function(){
              core_requestpointerlock(document.body);
          },
        },
        'text': {
          'onkeydown': function(event){
              if(event.key === 'Enter'){
                  event.preventDefault();
                  update_keys(event);
              }
          },
        },
      },
      'menu-block-events': false,
      'mousebinds': {
        'contextmenu': {
          'preventDefault': true,
        },
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui-elements': [
        'check-keys',
        'check-mouse',
        'code',
        'deltaY',
        'keys',
        'totals',
      ],
    });

    update_keys();
    globalThis.addEventListener('blur', update_keys);
    globalThis.addEventListener('keydown', update_keys);
    globalThis.addEventListener('keyup', update_keys);

    let html = '';
    for(const value in core_mouse){
        html += '<tr><td>' + value + '<td id=' + value + '>' + core_mouse[value];
    }
    document.getElementById('core_mouse').innerHTML = html;
    update_mouse();
    globalThis.addEventListener('blur', update_mouse);
    globalThis.addEventListener('contextmenu', update_mouse);
    globalThis.addEventListener('mousedown', update_mouse);
    globalThis.addEventListener('mousemove', update_mouse);
    globalThis.addEventListener('mouseup', update_mouse);
    globalThis.addEventListener('touchcancel', update_mouse);
    globalThis.addEventListener('touchend', update_mouse);
    globalThis.addEventListener('touchmove', update_mouse);
    globalThis.addEventListener('touchstart', update_mouse);
    globalThis.addEventListener('wheel', update_mouse);
}

function update(event){
    if(!event){
        return;
    }

    if(!totals[event.type]){
        totals[event.type] = 0;
        const li = document.createElement('li');
        li.innerHTML = event.type + ': <span id=' + event.type + '></span>';
        core_elements['totals'].appendChild(li);
    }

    core_ui_update({
      'ids': {
        [event.type]: ++totals[event.type],
        'event': core_type(event),
        'type': event.type,
      },
    });
}

function update_keys(event){
    if(core_menu_open
      || !core_elements['check-keys'].checked){
        return;
    }
    if(event
      && (event.code || event.key)){
        const code = event.code.length
          ? event.code
          : event.key;
        core_elements['code'].textContent = event.code.length
          ? 'code: ' + code
          : 'key: ' + code;

        if(!event.ctrlKey
          && !event.altKey
          && !event.metaKey
          && code !== 'ControlLeft'
          && code !== 'ControlRight'
          && code !== 'AltLeft'
          && code !== 'AltRight'
          && !core_keys[code]){
            core_keys[code] = {
              'preventDefault': false,
              'state': true,
            };
        }
    }
    update(event);

    const sorted_keys = core_sort_strings({
      'array': Object.keys(core_keys),
    });
    let keys_html = '';
    for(const key in sorted_keys){
        keys_html += '<tr><td>' + sorted_keys[key]
          + '<td>' + core_keys[sorted_keys[key]]['state'];
    }
    core_elements['keys'].innerHTML = keys_html;
}

function update_mouse(event){
    if(core_menu_open
      || !core_elements['check-mouse'].checked){
        return;
    }
    update(event);
    core_ui_update({
      'ids': {
        ...core_mouse,
        'deltaY': event?.deltaY || Number(core_elements['deltaY']?.textContent),
      },
    });
}
</script>
