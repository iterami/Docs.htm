<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Event Tests</title>
<link href=../../common/css/core.css rel=stylesheet>
<style>
table{
    display: inline-block;
    vertical-align: top;
}
</style>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/Events<br>
<table>
  <tbody id=totals>
    <tr class=header>
      <td>Events
      <td>Totals
</table><table>
  <tr>
    <td>core_type(event)
    <td id=event>
  <tr>
    <td>event.type
    <td id=type>
  <tr>
    <td>TouchEvent: <span id=touchevent></span>
    <td>core_mobile: <span id=core_mobile></span>
  <tr class=header>
    <td><input checked id=check_pointer type=checkbox>Pointer
    <td><input checked id=check_scroll type=checkbox>Scroll
  <tr>
    <td><button id=pointerLock type=button>pointerLock</button>
    <td><input id=text type=text>
  <tr>
    <td>deltaY Wheel
    <td id=deltaY>
  <tbody id=core_pointer>
</table><table>
  <tr class=header>
    <td><input checked id=check_keys type=checkbox>Keys
    <td>Modifiers
  <tr>
    <td>altKey
    <td id=altKey>
  <tr>
    <td>ctrlKey
    <td id=ctrlKey>
  <tr>
    <td>metaKey
    <td id=metaKey>
  <tr>
    <td>shiftKey
    <td id=shiftKey>
  <tr class=header>
    <td>Code:
    <td id=code>
  <tbody id=keys>
</table>

<script src=../../common/js/core.js></script>
<script>
function repo_escape(){
    update_keys();
    update_pointer();
}

function repo_init(){
    core_repo_init({
      'beforeunload': {
        'todo': function(event){
            update(event);
            event.preventDefault();
        },
      },
      'blur': {
        'todo': function(event){
            update(event);
            update_keys();
            update_pointer();
        },
      },
      'globals': {
        'totals': {},
      },
      'events': {
        'check_scroll': {
          'onchange': function(event){
              document.body.style.overflow = event.target.checked
                ? 'visible'
                : 'hidden';
          },
        },
        'pointerLock': {
          'onclick': function(){
              core_requestpointerlock(document.body);
          },
        },
        'text': {
          'onkeydown': function(event){
              if(event.key === 'Enter'){
                  event.preventDefault();
                  update_keys(event);
              }
          },
        },
      },
      'pointerbinds': {
        'contextmenu': {
          'preventDefault': true,
          'todo': update_pointer,
        },
        'pointercancel': {
          'todo': update_pointer,
        },
        'pointerdown': {
          'todo': update_pointer,
        },
        'pointermove': {
          'todo': update_pointer,
        },
        'pointerup': {
          'todo': update_pointer,
        },
        'wheel': {
          'todo': update_pointer,
        },
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui_elements': [
        'check_keys',
        'check_pointer',
        'code',
        'deltaY',
        'keys',
        'totals',
      ],
    });

    update_keys();
    globalThis.addEventListener('keydown', update_keys);
    globalThis.addEventListener('keyup', update_keys);

    let html = '';
    for(const value in core_pointer){
        html += '<tr><td>' + value + '<td id=' + value + '>' + core_pointer[value];
    }
    document.getElementById('core_pointer').innerHTML = html;
    update_pointer();
}

function update(event){
    if(!event){
        return;
    }

    if(!totals[event.type]){
        totals[event.type] = 0;
        core_elements.totals.insertAdjacentHTML(
          'beforeend',
          '<tr><td><a href=../common/js/core_handle_' + event.type + '.htm>' + event.type + '</a><td id=' + event.type + '>'
        );
    }

    core_ui_update({
      'ids': {
        [event.type]: ++totals[event.type],
        'altKey': event.altKey,
        'ctrlKey': event.ctrlKey,
        'event': core_type(event),
        'metaKey': event.metaKey,
        'shiftKey': event.shiftKey,
        'type': event.type,
      },
    });
}

function update_keys(event){
    if((core_menu_open && event)
      || !core_elements.check_keys.checked){
        return;
    }

    if(event){
        const code = event.code.length
          ? event.code
          : event.key;
        core_elements.code.textContent = code;

        if(code
          && !event.ctrlKey
          && !event.altKey
          && !event.metaKey
          && code !== 'ControlLeft'
          && code !== 'ControlRight'
          && code !== 'AltLeft'
          && code !== 'AltRight'
          && !core_keys[code]){
            core_keys[code] = {
              'preventDefault': false,
              'state': true,
            };
        }
    }

    update(event);

    const sorted_keys = core_sort_strings({
      'array': Object.keys(core_keys),
    });
    let keys_html = '';
    for(const key in sorted_keys){
        keys_html += '<tr><td>' + sorted_keys[key] + '<td>' + core_keys[sorted_keys[key]].state;
    }
    core_elements.keys.innerHTML = keys_html;
}

function update_pointer(event){
    if((core_menu_open && event)
      || !core_elements.check_pointer.checked){
        return;
    }

    update(event);

    core_ui_update({
      'ids': {
        'core_mobile': core_mobile,
        ...core_pointer,
        'deltaY': event?.deltaY || Number(core_elements.deltaY?.textContent),
        'touchevent': 'TouchEvent' in globalThis,
      },
    });
}
</script>
