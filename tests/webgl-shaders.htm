<table>
  <tr class=header id=fragment>
    <td>Fragment Shaders
    <td>Code
  <tr id=fragment-minimum>
    <td>Minimum
    <td><textarea readonly>#version 300 es
precision mediump float;

in vec4 color;
out vec4 fragment;

void main(void){
    fragment = color;
}
</textarea>
  <tr class=header id=vertex>
    <td>Vertex Shaders
    <td>Code
  <tr id=vertex-minimum>
    <td>Minimum
    <td><textarea readonly>#version 300 es

in vec3 vertexPosition;
in vec4 vertexColor;
out vec4 color;
uniform mat4 camera;
uniform mat4 perspective;

void main(void){
    color = vertexColor;
    gl_Position = perspective * camera
      * vec4(vertexPosition, 1.);
}
</textarea>
  <tr id=vertex-picking>
    <td>Picking
    <td><textarea readonly>#version 300 es

in vec3 vertexPosition;
in vec4 vertexColor;
out vec4 color;
uniform mat4 camera;
uniform mat4 perspective;

void main(void){
    color = vec4(
      (normalize(vertexPosition.x) + 1.) / 2.,
      (normalize(vertexPosition.y) + 1.) / 2.,
      (normalize(vertexPosition.z) + 1.) / 2.,
      1
    );
    gl_Position = perspective * camera
      * vec4(vertexPosition, 1.);
}
</textarea>
</table>
