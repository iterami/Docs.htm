<!doctype html>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Trigonometry Tests</title>
<link href=../../common/css/writings.css rel=stylesheet>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/Trigonometry
<table class=center>
  <tr class=header>
    <td>Part of a Right Triangle
    <td>Lengths and Degrees
  <tr>
    <td>Side: Adjacent X
    <td><input id=side_adjacent step=any type=number>
  <tr>
    <td>Side: Hypotenuse
    <td><input id=side_hypotenuse step=any type=number>
  <tr>
    <td>Side: Opposite Y
    <td><input id=side_opposite step=any type=number>
  <tr>
    <td>Angle (0.001-89.999)
    <td><input id=angle max=89.999 min=0.001 step=0.001 type=number>
  <tr>
    <td colspan=2><select id=type>
      <option value=acos>acos(X / hypotenuse)</option>
      <option value=asin>asin(Y / hypotenuse)</option>
      <option value=atan>atan(Y / X)</option>
      <option value=atan2>atan2(Y, X)</option>
      <option value=cos>cos(angle)</option>
      <option value=sin>sin(angle)</option>
      <option value=tan>tan(angle)</option>
      <option value=hypot>hypotenuse(X, Y)</option>
      <option value=x>X(angle, hypotenuse)</option>
      <option value=y>Y(angle, hypotenuse)</option>
    </select>
  <tr>
    <td><button onclick=calculate() type=button>Calculate</button>
    <td id=result>
</table>

<script>
function calculate(){
    let result = 0;
    const type = document.getElementById('type').value;

    if(type === 'acos'){
        result = radians_to_degrees(Math[type](
          document.getElementById('side_adjacent').value / document.getElementById('side_hypotenuse').value
        ));

    }else if(type === 'asin'){
        result = radians_to_degrees(Math[type](
          document.getElementById('side_opposite').value / document.getElementById('side_hypotenuse').value
        ));

    }else if(type === 'atan'){
        result = radians_to_degrees(Math[type](
          document.getElementById('side_opposite').value / document.getElementById('side_adjacent').value
        ));

    }else if(type === 'atan2'){
        result = radians_to_degrees(Math[type](
          document.getElementById('side_opposite').value,
          document.getElementById('side_adjacent').value
        ));

    }else if(type === 'hypot'){
        result = Math[type](
          document.getElementById('side_adjacent').value,
          document.getElementById('side_opposite').value
        );

    }else{
        const radians = degrees_to_radians(document.getElementById('angle').value);

        if(type === 'x'){
            result = Math.cos(radians) * document.getElementById('side_hypotenuse').value;

        }else if(type === 'y'){
            result = Math.sin(radians) * document.getElementById('side_hypotenuse').value;

        }else{
            result = Math[type](radians);
        }
    }

    document.getElementById('result').textContent = result;
}

function degrees_to_radians(degrees){
    return degrees * .017453292519943295;
}

function radians_to_degrees(radians){
    return radians * 57.29577951308232;
}
</script>
