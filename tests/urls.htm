<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>URL Tests</title>
<link href=../../common/css/writings.css rel=stylesheet>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/URLs<br>
<textarea id=url></textarea>
<table>
  <tr class=header>
    <td>Properties
    <td><button onclick=update() type=button>Update Values</button>
  <tbody id=properties></tbody>
  <tr class=header>
    <td>Parameters
    <td>Values
  <tbody id=parameters></tbody>
</table>

<script>
function update(){
    const location = new URL(document.getElementById('url').value);

    const keys = [];
    for(const property in location){
        keys.push(property);
    }
    keys.sort();
    let properties = '';
    for(const property of keys){
        if(typeof location[property] === 'function'){
            continue;
        }

        properties += '<tr><td>' + property + '<td>' + JSON.stringify(location[property]);
    }
    document.getElementById('properties').innerHTML = properties;

    const search = Object.fromEntries(new URLSearchParams(location.search));
    keys.length = 0;
    for(const parameter in search){
        keys.push(parameter);
    }
    keys.sort();
    let parameters = '';
    for(const parameter of keys){
        parameters += '<tr><td>' + parameter + '<td>' + JSON.stringify(search[parameter]);
    }
    document.getElementById('parameters').innerHTML = parameters;
}

globalThis.onload = function(){
    document.getElementById('url').value = globalThis.location.href + '?parameter=value#hash';
    update();
};
</script>
