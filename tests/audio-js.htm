<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>common audio.js Tests</title>
<link href=../../common/css/core.css rel=stylesheet>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/<a href=../../common/index.htm>common</a>/<a href=../common/js/audio.htm>audio.js</a><br>
<textarea id=args>{
  "duration": 0.1,
  "frequency": 100,
  "panner": false,
  "type": "sine"
}</textarea><br>
<button class=medium id=play_boop type=button>Play Boop</button><button class=medium id=play_custom type=button>Play Custom</button>
<table>
  <tr class=header>
    <td>Listener
    <td>Value
  <tr>
    <td>forwardX
    <td><input id=forwardX step=any type=number value=0>
  <tr>
    <td>forwardY
    <td><input id=forwardY step=any type=number value=0>
  <tr>
    <td>forwardZ
    <td><input id=forwardZ step=any type=number value=-1>
  <tr class=header>
    <td>Panner
    <td>Value
  <tr>
    <td>positionX
    <td><input id=positionX step=any type=number value=0>
  <tr>
    <td>positionY
    <td><input id=positionY step=any type=number value=0>
  <tr>
    <td>positionZ
    <td><input id=positionZ step=any type=number value=0>
</table>
<button class=medium id=play_custom_at type=button>Play Custom At Position</button>

<script src=../../common/js/core.js></script>
<script src=../../common/js/audio.js></script>
<script>
function custom_audio(){
    audio_create({
      'custom': JSON.parse(core_elements.args.value),
    });
    audio_start('custom');
}

function custom_audio_at(){
    audio_create({
      'custom': JSON.parse(core_elements.args.value),
    });
    audio_start_at({
      'forwardX': core_elements.forwardX.value,
      'forwardY': core_elements.forwardY.value,
      'forwardZ': core_elements.forwardZ.value,
      'id': 'custom',
      'positionX': core_elements.positionX.value,
      'positionY': core_elements.positionY.value,
      'positionZ': core_elements.positionZ.value,
    });
}

function repo_init(){
    core_repo_init({
      'events': {
        'play_boop': {
          'onclick': function(){
              audio_start('boop');
          },
        },
        'play_custom': {
          'onclick': custom_audio,
        },
        'play_custom_at': {
          'onclick': custom_audio_at,
        },
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui_elements': [
        'args',
        'forwardX',
        'forwardY',
        'forwardZ',
        'positionX',
        'positionY',
        'positionZ',
      ],
    });
}
</script>
