<!doctype html>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Collision Tests</title>
<link href=../../common/css/core.css rel=stylesheet>
<style>
#aligned,
#collider{
   background: #fff;
   border-radius: 10px;
   height: 20px;
   left: 140px;
   position: absolute;
   top: 140px;
   width: 20px;
}
#aligned-x,
#aligned-y,
#collider-x,
#collider-y{
   background: #fff;
   height: 6px;
   left: 100px;
   position: absolute;
   top: 147px;
   width: 100px;
}
#aligned-x,
#collider-x{
   background: #f00;
}
#aligned-y,
#collider-y{
   background: #0f0;
}
.display{
   height: 300px;
}
td{
   border-width: 0;
   position: relative;
}
#wall,
#wall-aligned{
   background: #fff;
   height: 20px;
   left: 0;
   position: absolute;
   top: 140px;
   width: 300px;
}
table{
   width: 600px;
}
</style>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/Collision
<table>
  <tr class=display>
    <td><div id=wall></div><div id=collider></div><div id=collider-x></div><div id=collider-y></div>
    <td><div id=wall-aligned></div><div id=aligned></div><div id=aligned-x></div><div id=aligned-y></div>
  <tr>
    <td colspan=2><input id=wall-rotation max=360 type=range value=0><div id=wall-rotation-value></div>
      X<input id=change-x step=any type=number value=5><br>
      Y<input id=change-y step=any type=number value=5>
</table>

<script src=../../common/js/core.js></script>
<script>
function repo_init(){
    core_repo_init({
      'events': {
        'change-x': {
          'oninput': update_display,
        },
        'change-y': {
          'oninput': update_display,
        },
        'wall-rotation': {
          'oninput': update_display,
        },
      },
      'title': 'Docs.htm',
      'ui-elements': [
        'aligned',
        'aligned-x',
        'aligned-y',
        'change-x',
        'change-y',
        'collider',
        'collider-x',
        'collider-y',
        'wall',
        'wall-rotation',
        'wall-rotation-value',
      ],
    });

    update_display();
}

function update_display(){
    const rotation = core_elements['wall-rotation'].value;
    core_elements['wall-rotation-value'].textContent = rotation;
    core_elements['wall'].style.transform = 'rotate(' + rotation + 'deg)';

    const collider_transform = ' translateY(-50px)';
    core_elements['aligned'].style.transform = collider_transform;
    core_elements['collider'].style.transform = 'rotate(' + rotation + 'deg)' + collider_transform;

    const axes = {
      'x': 'translateY(-50px) rotate(' + (360 - rotation) + 'deg)',
      'y': 'translateY(-50px) rotate(' + (360 - rotation + 90) + 'deg)',
    };
    for(const axis in axes){
         const aligned = core_elements['aligned-' + axis];
         const change = core_elements['change-' + axis].value;
         const collider = core_elements['collider-' + axis];

         const width = Math.abs(change) * 10;
         const transform = axes[axis] + ' translateX(' + (width / 2) + 'px)' + (Math.sign(change) > 0
           ? ''
           : ' translateX(' + -width + 'px)');

         aligned.style.left = collider.style.left = (150 - width / 2) + 'px';
         aligned.style.width = collider.style.width = width + 'px';
         collider.style.transform = 'rotate(' + rotation + 'deg) ' + transform;
         aligned.style.transform = transform;
    }
}
</script>
