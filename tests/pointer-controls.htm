<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Pointer Control Tests</title>
<link href=../../common/css/core.css rel=stylesheet>
<style>
.direction{
    height: 2rem;
    left: 50%;
    position: absolute;
    transform-origin: left;
    width: 3rem;
}
#direction_4{
    background: #00f;
    top: 50%;
}
#direction_4_relative{
    background: #f0f;
    left: 25%;
    top: 75%;
}
#direction_leftright{
    background: #f00;
    top: 20%;
}
#direction_leftright_relative{
    background: #0f0;
    left: 25%;
    top: 23%;
}
#direction_updown{
    background: #0ff;
    left: 73%;
    top: 50%;
}
#direction_updown_relative{
    background: #ff0;
    left: 75%;
    top: 75%;
}
</style>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/Pointer Controls
<div class=direction id=direction_4></div>
<div class=direction id=direction_4_relative></div>
<div class=direction id=direction_leftright></div>
<div class=direction id=direction_leftright_relative></div>
<div class=direction id=direction_updown></div>
<div class=direction id=direction_updown_relative></div>

<script src=../../common/js/core.js></script>
<script>
function direction_reset(){
    core_elements.direction_4.style.width = size_small;
    core_elements.direction_4_relative.style.width = size_small;
    core_elements.direction_leftright.style.width = size_small;
    core_elements.direction_leftright_relative.style.width = size_small;
    core_elements.direction_updown.style.width = size_small;
    core_elements.direction_updown_relative.style.width = size_small;
}

function direction_update(){
    if(!core_pointer.down_0){
        return;
    }

    const angles = [0, 90, 180, 270]; // 0=right, 1=down, 2=left, 3=up
    let direction = 0;
    const style_4 = core_elements.direction_4.style;
    const style_4_relative = core_elements.direction_4_relative.style;
    const style_leftright = core_elements.direction_leftright.style;
    const style_leftright_relative = core_elements.direction_leftright_relative.style;
    const style_updown = core_elements.direction_updown.style;
    const style_updown_relative = core_elements.direction_updown_relative.style;
    const x = core_pointer.x;
    const y = core_pointer.y;

    style_leftright.width = size_big;
    if(x > globalThis.innerWidth / 2){
        direction = 0;

    }else{
        direction = 2;
    }
    style_leftright.transform = 'rotate(' + angles[direction] + 'deg)';

    style_leftright_relative.width = size_big;
    if(x > core_elements.direction_leftright_relative.offsetLeft){
        direction = 0;

    }else{
        direction = 2;
    }
    style_leftright_relative.transform = 'rotate(' + angles[direction] + 'deg)';

    style_updown.width = size_big;
    if(y > globalThis.innerHeight / 2){
        direction = 1;

    }else{
        direction = 3;
    }
    style_updown.transform = 'rotate(' + angles[direction] + 'deg)';

    style_updown_relative.width = size_big;
    if(y > core_elements.direction_updown_relative.offsetTop){
        direction = 1;

    }else{
        direction = 3;
    }
    style_updown_relative.transform = 'rotate(' + angles[direction] + 'deg)';

    style_4.width = size_big;
    const x_normalized = x / globalThis.innerWidth;
    const y_normalized = y / globalThis.innerHeight;
    if(x_normalized < .5){
        if(y_normalized < x_normalized){
            direction = 3;

        }else if(y_normalized > 1 - x_normalized){
            direction = 1;

        }else{
            direction = 2;
        }

    }else if(x_normalized < y_normalized){
        direction = 1;

    }else if(x_normalized < 1 - y_normalized){
        direction = 3;

    }else{
        direction = 0;
    }
    style_4.transform = 'rotate(' + angles[direction] + 'deg)';

    style_4_relative.width = size_big;
    const x_relative = x - core_elements.direction_4_relative.offsetLeft;
    const y_relative = y - core_elements.direction_4_relative.offsetTop;
    if(x_relative < 0){
        if(y_relative < x_relative){
            direction = 3;

        }else if(y_relative > 0 && -y_relative < x_relative){
            direction = 1;

        }else{
            direction = 2;
        }

    }else if(x_relative < y_relative){
        direction = 1;

    }else if(y_relative < 0 && -y_relative > x_relative){
        direction = 3;

    }else{
        direction = 0;
    }
    style_4_relative.transform = 'rotate(' + angles[direction] + 'deg)';
}

function repo_escape(){
    direction_reset();
}

function repo_init(){
    core_repo_init({
      'globals': {
        'size_big': '6rem',
        'size_small': '3rem',
      },
      'pointerbinds': {
        'pointerdown': direction_update,
        'pointermove': direction_update,
        'pointerup': direction_reset,
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui_elements': [
        'direction_4',
        'direction_4_relative',
        'direction_leftright',
        'direction_leftright_relative',
        'direction_updown',
        'direction_updown_relative',
      ],
    });
}
</script>
