<!doctype html>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Pointer Control Tests</title>
<link href=../../common/css/core.css rel=stylesheet>
<style>
.direction{
    height: 20px;
    left: 50%;
    position: absolute;
    transform-origin: left;
    width: 30px;
}
#direction-2{
    background: #f00;
    top: 20%;
}
#direction-2-relative{
    background: #0f0;
    left: 25%;
    top: 23%;
}
#direction-4{
    background: #00f;
    top: 50%;
}
#direction-4-relative{
    background: #f0f;
    left: 25%;
    top: 75%;
}
</style>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/Pointer Controls
<div class=direction id=direction-2></div>
<div class=direction id=direction-2-relative></div>
<div class=direction id=direction-4></div>
<div class=direction id=direction-4-relative></div>

<script src=../../common/js/core.js></script>
<script>
function direction_reset(){
    core_elements['direction-2'].style.width = '30px';
    core_elements['direction-2-relative'].style.width = '30px';
    core_elements['direction-4'].style.width = '30px';
    core_elements['direction-4-relative'].style.width = '30px';
}

function direction_update(){
    if(!core_pointer['down-0']){
        return;
    }

    const angles = [0, 90, 180, 270]; // 0=right, 1=down, 2=left, 3=up
    let direction = 0;
    const style_2 = core_elements['direction-2'].style;
    const style_2_relative = core_elements['direction-2-relative'].style;
    const style_4 = core_elements['direction-4'].style;
    const style_4_relative = core_elements['direction-4-relative'].style;
    const x = core_pointer['x'];
    const y = core_pointer['y'];

    style_2.width = '100px';
    if(x > globalThis.innerWidth / 2){
        direction = 0;

    }else{
        direction = 2;
    }
    style_2.transform = 'rotate(' + angles[direction] + 'deg)';

    style_2_relative.width = '100px';
    if(x > core_elements['direction-2-relative'].offsetLeft){
        direction = 0;

    }else{
        direction = 2;
    }
    style_2_relative.transform = 'rotate(' + angles[direction] + 'deg)';

    style_4.width = '100px';
    const x_normalized = x / globalThis.innerWidth;
    const y_normalized = y / globalThis.innerHeight;
    if(x_normalized < .5){
        if(y_normalized < x_normalized){
            direction = 3;

        }else if(y_normalized > 1 - x_normalized){
            direction = 1;

        }else{
            direction = 2;
        }

    }else if(x_normalized < y_normalized){
        direction = 1;

    }else if(x_normalized < 1 - y_normalized){
        direction = 3;

    }else{
        direction = 0;
    }
    style_4.transform = 'rotate(' + angles[direction] + 'deg)';

    style_4_relative.width = '100px';
    const x_relative = x - core_elements['direction-4-relative'].offsetLeft;
    const y_relative = y - core_elements['direction-4-relative'].offsetTop;
    if(x_relative < 0){
        if(y_relative < x_relative){
            direction = 3;

        }else if(y_relative > 0 && -y_relative < x_relative){
            direction = 1;

        }else{
            direction = 2;
        }

    }else if(x_relative < y_relative){
        direction = 1;

    }else if(y_relative < 0 && -y_relative > x_relative){
        direction = 3;

    }else{
        direction = 0;
    }
    style_4_relative.transform = 'rotate(' + angles[direction] + 'deg)';
}

function repo_init(){
    core_repo_init({
      'pointerbinds': {
        'pointerdown': {
          'todo': direction_update,
        },
        'pointermove': {
          'todo': direction_update,
        },
        'pointerup': {
          'todo': direction_reset,
        },
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui_elements': [
        'direction-2',
        'direction-2-relative',
        'direction-4',
        'direction-4-relative',
      ],
    });
}
</script>
