<!doctype html>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Pointer Control Tests</title>
<link href=../../common/css/core.css rel=stylesheet>
<style>
#direction-2,
#direction-4{
    background: #fff;
    height: 20px;
    left: 50%;
    position: absolute;
    transform-origin: left;
    width: 30px;
}
#direction-2{
    top: 25%;
}
#direction-4{
    top: 50%;
}
</style>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/Pointer Controls
<div id=direction-2></div>
<div id=direction-4></div>

<script src=../../common/js/core.js></script>
<script>
function direction_reset(){
    core_elements['direction-2'].style.width = '30px';
    core_elements['direction-4'].style.width = '30px';
}

function direction_update(){
    if(!core_pointer['down-0']){
        return;
    }

    const style_2 = core_elements['direction-2'].style;
    const style_4 = core_elements['direction-4'].style;

    style_2.width = '100px';
    style_4.width = '100px';

    const rotate_2 = core_pointer['x'] > globalThis.innerWidth / 2
      ? 0
      : 180;
    style_2.transform = 'rotate(' + rotate_2 + 'deg)';

    // 0=right, 1=down, 2=left, 3=up
    const angles = [0, 90, 180, 270];
    let direction = false;
    const x = core_pointer['x'] - globalThis.innerWidth / 2;
    const y = core_pointer['y'] - globalThis.innerHeight / 2;
    if(x < 0){
        if(y < x){
            direction = 3;

        }else if(y > 0 && -y < x){
            direction = 1;

        }else{
            direction = 2;
        }

    }else if(x < y){
        direction = 1;

    }else if(y < 0 && -y > x){
        direction = 3;

    }else{
        direction = 0;
    }
    style_4.transform = 'rotate(' + angles[direction] + 'deg)';
}

function repo_init(){
    core_repo_init({
      'pointerbinds': {
        'pointerdown': {
          'todo': direction_update,
        },
        'pointermove': {
          'todo': direction_update,
        },
        'pointerup': {
          'todo': direction_reset,
        },
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui-elements': [
        'direction-2',
        'direction-4',
      ],
    });
}
</script>
