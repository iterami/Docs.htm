<table>
  <tr>
    <td>Average
    <td><input id=average readonly type=text>
  <tr class=header>
    <td>Offsets
    <td id=count>
  <tbody id=totals>
</table>

<script src=../../common/js/core.js></script>
<script>
function interval(){
    const ms = new Date().getMilliseconds();

    if(skip
      || ms > 995){
        skip = false;
        return;
    }
    count++;
    total += ms;
    average = total / count;

    if(!totals[ms]){
        totals[ms] = 0;
        core_elements.totals.insertAdjacentHTML(
          'beforeend',
          '<tr><td>' + ms + '<td id=' + ms + '>'
        );
    }

    core_ui_update({
      'ids': {
        [ms]: ++totals[ms],
        'average': average,
        'count': count,
      },
    });
}

function repo_escape(){
    skip = true;
}

function repo_init(){
    core_repo_init({
      'globals': {
        'average': 0,
        'count': 0,
        'skip': true,
        'total': 0,
        'totals': {},
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui_elements': [
        'totals',
      ],
    });

    core_interval_modify({
      'id': 'interval',
      'interval': -2,
      'todo': interval,
    });
}
</script>
