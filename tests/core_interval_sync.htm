<table>
  <tr class=header>
    <td>Milliseconds
    <td>Count
  <tbody id=totals>
</table>

<script src=../../common/js/core.js></script>
<script>
function interval(){
    const ms = new Date().getMilliseconds();
    if(!totals[ms]){
        totals[ms] = 0;
    }
    totals[ms]++;

    if(!core_elements[ms]){
        core_elements.totals.insertAdjacentHTML(
          'beforeend',
          '<tr><td>' + ms + '<td id=' + ms + '>'
        );
        core_elements[ms] = document.getElementById(ms);
    }

    core_elements[ms].textContent = totals[ms];
}

function repo_init(){
    core_repo_init({
      'globals': {
        'totals': {},
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui_elements': [
        'totals',
      ],
    });

    core_interval_modify({
      'id': 'interval',
      'interval': -2,
      'todo': interval,
    });
}
</script>
