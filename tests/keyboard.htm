<!doctype html>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Keyboard Tests</title>
<link href=../../common/css/core.css rel=stylesheet>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/Keyboard
<table>
  <thead>
    <tr>
      <td>core_type(event)
      <td id=event>
    <tr>
      <td>event.type
      <td id=type>
    <tr class=header>
      <td>Key
      <td>state
  <tbody id=keys>
</table>

<script src=../../common/js/core.js></script>
<script>
function repo_init(){
    core_repo_init({
      'title': 'Docs.htm',
      'ui-elements': [
        'keys',
      ],
    });

    update_keys();
    globalThis.addEventListener('blur', update_keys);
    globalThis.addEventListener('keydown', update_keys);
    globalThis.addEventListener('keyup', update_keys);
}

function update_keys(event){
    if(event
      && event.code
      && !event.ctrlKey
      && !event.altKey
      && !event.metaKey
      && event.code !== 'ControlLeft'
      && event.code !== 'ControlRight'
      && event.code !== 'AltLeft'
      && event.code !== 'AltRight'
      && !core_keys[event.code]){
        core_keys[event.code] = {
          'preventDefault': false,
          'state': true,
        };
    }

    const sorted_keys = core_sort_strings({
      'array': Object.keys(core_keys),
    });
    let keys_html = '';
    for(const key in sorted_keys){
        keys_html += '<tr><td>' + sorted_keys[key]
          + '<td>' + core_keys[sorted_keys[key]]['state'];
    }
    core_elements['keys'].innerHTML = keys_html;

    core_ui_update({
      'ids': {
        'event': core_type(event),
        'type': event?.type,
      },
    });
}
</script>
