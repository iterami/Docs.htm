<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Browser Feature Tests</title>
<link href=../../common/css/writings.css rel=stylesheet>
<style>
canvas{
    display: none;
}
</style>

<a href=../../index.htm>iterami</a>/<a href=../index.htm>Docs.htm</a>/<a href=index.htm>Tests</a>/Browser Features
<table>
  <tr class=header>
    <td>Feature
    <td>Status
  <tbody id=results></tbody>
</table>
<canvas id=canvas></canvas>
<canvas id=webgl></canvas>
<button id=pointerlock onclick=pointerlock_request()>document.body.requestPointerLock()</button> <span id=pointerlock_element></span>

<script>
function pointerlock_exit(){
    document.exitPointerLock();
}

function pointerlock_request(){
    document.body.requestPointerLock();
}

function pointerlock_update(event){
    const element = document.pointerLockElement;
    document.getElementById('pointerlock_element').textContent = event.type + ': '
      + (element === null
        ? 'null'
        : element.localName);
}

function test_canvaspicking(){
    const pixel = document.getElementById('canvas').getContext('2d').getImageData(0, 0, 1, 1).data;
    return pixel[0] === 0 && pixel[1] === 0 && pixel[2] === 0;
}

function test_images(){
    const image = new Image();
    image.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIW2P8////fwAKAAP+j4hsjgAAAABJRU5ErkJggg==';
    image.onload = function(){
        document.getElementById('result_Images').textContent = true;
    };
}

function test_localStorage(){
    try{
        const id = 'iterami-localstorage-test';
        globalThis.localStorage.setItem(id, 'test');
        globalThis.localStorage.removeItem(id);
        return true;

    }catch(error){
        return error;
    }
}

function test_mediadevices(){
    navigator.mediaDevices.getUserMedia({
      'audio': false,
      'video': false,
    }).then(function(stream){
        document.getElementById('result_MediaDevices').textContent = true;

    }).catch(function(error){
        document.getElementById('result_MediaDevices').textContent = error;
    });
}

globalThis.onload = function(){
    let css = 'CSS' in globalThis;
    if(css){
        css = CSS.supports('transform', 'rotate(90deg)');
    }
    let webgl = !!globalThis.WebGL2RenderingContext;
    if(webgl){
        const context = document.getElementById('webgl').getContext('webgl2');
        webgl = context.getParameter(context.VERSION) + ', ' + context.getParameter(context.SHADING_LANGUAGE_VERSION);
    }

    const features = {
      'addEventListener': !!globalThis.addEventListener,
      'AudioAPI': 'AudioContext' in globalThis,
      'Canvas Picking': test_canvaspicking(),
      'canvas': !!document.getElementById('canvas').getContext('2d'),
      'contextmenu': 'oncontextmenu' in globalThis,
      'CSS Rotation Transform': css,
      'Images': test_images(),
      'localStorage': test_localStorage(),
      'MediaDevices': test_mediadevices(),
      'PointerEvent': 'PointerEvent' in globalThis,
      'pointerLockElement': 'pointerLockElement' in document,
      'TouchEvent': 'TouchEvent' in globalThis,
      'WebGL2': webgl,
    };
    let result = '';
    for(const feature in features){
        result += '<tr><td>' + feature + '<td id="result_' + feature + '">' + features[feature];
    }
    document.getElementById('results').innerHTML = result;

    document.onpointerlockchange = pointerlock_update;
    document.onpointerlockerror = pointerlock_update;
    globalThis.onkeydown = pointerlock_exit;
};
</script>
