<script src=../../common/js/test.js></script>
<script>
function repo_init(){
    core_repo_init({
      'root': 'index.htm',
      'title': 'Docs.htm',
    });

    document.getElementById('consts').innerHTML = test_consts({
      'consts': [
        'Number.EPSILON',
      ],
    });
    document.getElementById('results').innerHTML = test_run({
      'link': '../common/js/',
      'tests': [
        {
          'todo': 'core_digits_min',
          'args': {
            'digits': 3,
            'number': 7777,
          },
          'expect': '7777',
        },
        {
          'todo': 'core_digits_min',
          'args': {
            'digits': 3,
            'number': 7,
          },
          'expect': '007',
        },
        {
          'todo': 'core_digits_min',
          'args': {
            'digits': 3,
            'number': -7,
          },
          'expect': '-007',
        },
        {
          'todo': 'core_digits_min',
          'args': {
            'digits': 3,
            'number': -7.7,
          },
          'expect': '-007.7',
        },
        {
          'todo': 'core_float_compare',
          'args': {
            'a': 0.1 + 0.2 + 0.3,
            'b': 0.6,
            'precision': 0,
          },
          'expect': false,
        },
        {
          'todo': 'core_float_compare',
          'args': {
            'a': 0.1 + 0.2 + 0.3,
            'b': 0.6,
            'precision': Number.EPSILON,
          },
          'expect': true,
        },
        {
          'todo': 'core_float_compare',
          'args': {
            'a': 0.1 + 0.2 + 0.3,
            'b': 0.6,
            'precision': 1e-15,
          },
          'expect': true,
        },
        {
          'todo': 'core_float_compare',
          'args': {
            'a': 0.1 + 0.2 + 0.3,
            'b': 0.6,
            'precision': 1e-16,
          },
          'expect': false,
        },
        {
          'todo': 'core_hex_to_rgb',
          'args': '#abc',
          'expect': {
            'blue': 204,
            'green': 187,
            'red': 170,
          },
        },
        {
          'todo': 'core_hex_to_rgb',
          'args': '#abcdef',
          'expect': {
            'blue': 239,
            'green': 205,
            'red': 171,
          },
        },
        {
          'todo': 'core_html',
          'args': {
            'parent': document.body,
            'properties': {
              'id': 'core_html-element',
            },
          },
          'expect': function(result){
              return document.getElementById('core_html-element') === result;
          },
        },
        {
          'todo': 'core_html_format',
          'args': `<u>'
"&</u>`,
          'expect': '&lt;u&gt;&apos;<br>&quot;&amp;&lt;/u&gt;',
        },
        {
          'todo': 'core_number_format',
          'args': {
            'number': '1234.56789',
          },
          'expect': '1,234.56789',
        },
        {
          'todo': 'core_number_format',
          'args': {
            'decimals_max': 1,
            'number': '1234.44444',
          },
          'expect': '1,234.4',
        },
        {
          'todo': 'core_number_format',
          'args': {
            'decimals_max': 1,
            'number': '1234.55555',
          },
          'expect': '1,234.6',
        },
        {
          'todo': 'core_number_format',
          'args': {
            'decimals_max': 7,
            'number': '1234.56789',
          },
          'expect': '1,234.56789',
        },
        {
          'todo': 'core_number_format',
          'args': {
            'decimals_min': 2,
            'number': '1234.1234',
          },
          'expect': '1,234.1234',
        },
        {
          'todo': 'core_number_format',
          'args': {
            'decimals_min': 7,
            'number': '1234.56789',
          },
          'expect': '1,234.5678900',
        },
        {
          'todo': 'core_object_defaults',
          'args': {
            'defaults': {
              'test': 1,
            },
          },
          'expect': function(result){
              return result.test === 1;
          },
        },
        {
          'todo': 'core_object_defaults',
          'args': {
            'object': {},
            'defaults': {
              'test': 1,
            },
          },
          'expect': function(result){
              return result.test === 1;
          },
        },
        {
          'todo': 'core_object_defaults',
          'args': {
            'object': {
              'test': 2,
            },
            'defaults': {
              'test': 1,
            },
          },
          'expect': function(result){
              return result.test === 2;
          },
        },
        {
          'todo': 'core_random_boolean',
          'args': void 0,
          'expect': function(result){
              return typeof result === 'boolean';
          },
        },
        {
          'todo': 'core_random_boolean',
          'args': 0,
          'expect': false,
        },
        {
          'todo': 'core_random_drop',
          'args': {
            'options': {},
          },
          'expect': false,
        },
        {
          'todo': 'core_random_drop',
          'args': {
            'options': {
              'guaranteed': 1,
            },
          },
          'expect': 'guaranteed',
        },
        {
          'todo': 'core_random_drop',
          'args': {
            'nothing_type': -1,
            'options': {
              'guaranteed': .1,
            },
          },
          'expect': 'guaranteed',
        },
        {
          'todo': 'core_random_hex',
          'args': void 0,
          'expect': function(result){
              return typeof result === 'string' && result.length === 6;
          },
        },
        {
          'todo': 'core_random_integer',
          'args': 100,
          'expect': function(result){
              return Number.isInteger(result);
          },
        },
        {
          'todo': 'core_random_integer',
          'args': 1,
          'expect': 0,
        },
        {
          'todo': 'core_random_key',
          'args': {
            'test-key': 1,
          },
          'expect': 'test-key',
        },
        {
          'todo': 'core_random_string',
          'args': {
            'length': 5,
          },
          'expect': function(result){
              return typeof result === 'string';
          },
        },
        {
          'todo': 'core_replace',
          'args': {
            'patterns': {
              'i ': ' ',
              'it': '',
            },
            'string': 'iterami iterami iterami',
          },
          'expect': 'eram eram erami',
        },
        {
          'todo': 'core_round',
          'args': {
            'decimals': 0,
            'number': 123.456,
          },
          'expect': 123,
        },
        {
          'todo': 'core_round',
          'args': {
            'decimals': 1,
            'number': 123.456,
          },
          'expect': 123.5,
        },
        {
          'todo': 'core_round',
          'args': {
            'decimals': 7,
            'number': 123.456,
          },
          'expect': 123.456,
        },
        {
          'todo': 'core_round',
          'args': {
            'decimals': 1,
            'number': 1.234e23,
          },
          'expect': 1.2e23,
        },
        {
          'todo': 'core_sort_numbers',
          'args': {
            'array': [
              8,
              16,
              4,
              42,
              23,
              15,
            ],
          },
          'expect': [
            4,
            8,
            15,
            16,
            23,
            42,
          ],
        },
        {
          'todo': 'core_sort_property',
          'args': {
            'array': [
              {
                'test': 1,
              },
              {
                'test': 0,
              },
              {
                'test': 3,
              },
              {
                'test': 2,
              },
            ],
            'property': 'test',
          },
          'expect': function(result){
              return result[0].test === 0
                && result[1].test === 1
                && result[2].test === 2
                && result[3].test === 3;
          },
        },
        {
          'todo': 'core_sort_strings',
          'args': {
            'array': [
              'eight',
              'sixteen',
              'four',
              'fortytwo',
              'twentythree',
              'fifteen',
            ],
          },
          'expect': [
            'eight',
            'fifteen',
            'fortytwo',
            'four',
            'sixteen',
            'twentythree',
          ],
        },
        {
          'todo': 'core_type',
          'args': [1, 2, 3],
          'expect': 'array',
        },
        {
          'todo': 'core_type',
          'args': false,
          'expect': 'boolean',
        },
        {
          'todo': 'core_type',
          'args': true,
          'expect': 'boolean',
        },
        {
          'todo': 'core_type',
          'args': function(){
              return false;
          },
          'expect': 'function',
        },
        {
          'todo': 'core_type',
          'args': 7777,
          'expect': 'number',
        },
        {
          'todo': 'core_type',
          'args': {
            'property': 'value',
          },
          'expect': 'object',
        },
        {
          'todo': 'core_type',
          'args': 'text goes here',
          'expect': 'string',
        },
        {
          'todo': 'core_type',
          'args': void 0,
          'expect': 'undefined',
        },
      ],
    });
}
</script>
