<script src=../../common/js/core.js></script>
<script>
function repo_init(){
    core_repo_init({
      'info': '<div id=info_element>info_element</div>',
      'root': 'index.htm',
      'storage': {
        'storage_element': 'storage_element',
      },
      'storage_controls': true,
      'storage_menu': '<div id=storage_element></div>',
      'tabs': {
        'test': {
          'content': '<div id=tab_element>tab_element</div>',
          'group': 'test',
          'label': 'Test Tab',
        },
      },
      'title': 'Docs.htm',
      'ui': '<div id=ui_element>ui_element</div>',
      'ui_elements': [
        'existing_element',
        'info_element',
        'storage_element',
        'tab_element',
        'ui_element',
      ],
    });

    const elements = [
      'existing_element',
      'fake_element',
      'info_element',
      'move_up',
      'storage_element',
      'tab_element',
      'ui_element',
      'unadded_element',
    ];
    for(const id of elements){
        document.getElementById(id + '_result').textContent = String(core_elements[id]);
    }
}
</script>
