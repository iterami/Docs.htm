<script>
function repo_init(){
    core_repo_init({
      'globals': {
        'test_global': 'test global value',
      },
      'events': {
        'existing_element': {
          'textContent': 'existing_element',
        },
        'info_element': {
          'textContent': 'info_element',
        },
        'tab_element': {
          'textContent': 'tab_element',
        },
        'ui_element': {
          'textContent': 'ui_element',
        },
        'unadded_element': {
          'textContent': 'unadded_element',
        },
      },
      'info': '<div id=info_element></div>',
      'link': '../common/js/core_repo_init.htm',
      'menu': true,
      'menu_block_events': false,
      'owner': 'Test Owner',
      'root': 'index.htm',
      'storage': {
        'storage_element': 'storage_element',
      },
      'storage_controls': true,
      'storage_menu': '<div id=storage_element></div>',
      'tabs': {
        'test': {
          'content': '<div id=tab_element></div>',
          'group': 'test',
          'label': 'Test Tab',
        },
      },
      'title': 'Test Title',
      'ui': '<div id=ui_element></div>',
      'ui_elements': [
        'existing_element',
        'info_element',
        'storage_element',
        'tab_element',
        'ui_element',
      ],
    });

    const elements = [
      'existing_element',
      'fake_element',
      'info_element',
      'move_up',
      'storage_element',
      'tab_element',
      'ui_element',
      'unadded_element',
    ];
    for(const id of elements){
        document.getElementById(id + '_result').textContent = String(core_elements[id]);
    }
    console.log(test_global, globalThis.test_global, window.test_global);
}
</script>
