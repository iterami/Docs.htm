<script src=../../common/js/test.js></script>
<script src=../../common/js/math.js></script>
<script src=../../common/js/entity.js></script>
<script src=../../common/js/webgl.js></script>
<script>
function repo_init(){
    core_repo_init({
      'root': 'index.htm',
      'storage_controls': true,
      'title': 'Docs.htm',
    });
    webgl_level_load({
      'character': -1,
    });
    webgl_character_init({
      'id': 'test_character_0',
      'level': 1,
      'spawn':{
        'position_x': 23,
      },
    });

    document.getElementById('results').innerHTML = test_run({
      'link': '../common/js/',
      'tests': [
        {
          'args': {
            'id': 'test_character_1',
            'level': 5,
          },
          'expect': function(result){
              return webgl_characters.test_character_1.life > 0;
          },
          'function': 'webgl_character_init',
        },
        {
          'args': void 0,
          'expect': -1,
          'function': 'webgl_character_level',
        },
        {
          'args': 'fake_character',
          'expect': -3,
          'function': 'webgl_character_level',
        },
        {
          'args': webgl_characters.test_character_0,
          'expect': 1,
          'function': 'webgl_character_level',
        },
        {
          'args': {
            'blue': .3,
            'green': .2,
            'red': .1,
          },
          'expect': function(result){
              const clearcolor = webgl.getParameter(webgl.COLOR_CLEAR_VALUE);
              return webgl_properties.clear_color[0] === .1
                && webgl_properties.clear_color[1] === .2
                && webgl_properties.clear_color[2] === .3
                && core_float_compare({
                  'a': clearcolor[0],
                  'b': .1,
                  'precision': .001,
                })
                && core_float_compare({
                  'a': clearcolor[1],
                  'b': .2,
                  'precision': .001,
                })
                && core_float_compare({
                  'a': clearcolor[2],
                  'b': .3,
                  'precision': .001,
                });
          },
          'function': 'webgl_color_set',
        },
        {
          'args': webgl_characters.test_character_0,
          'expect': function(result){
              return result.x === 23;
          },
          'function': 'webgl_get_position',
        },
        {
          'args': {
            'move': webgl_characters.test_character_0,
            'y': 23,
          },
          'expect': function(result){
              return webgl_characters.test_character_0.position_y === 23;
          },
          'function': 'webgl_move_to',
        },
        {
          'args': {
            'rotate-x': webgl_characters.test_character_0.rotate_x,
            'rotate-y': webgl_characters.test_character_0.rotate_y,
            'rotate-z': webgl_characters.test_character_0.rotate_z,
            'vertices-length': 1,
          },
          'expect': [
            0,
            1,
            0,
          ],
          'function': 'webgl_normals',
        },
        {
          'args': {
            'x': 0,
            'y': 0,
          },
          'expect': [
            0,
            0,
            0,
            0,
          ],
          'function': 'webgl_pick_color',
        },
        {
          'args': {
            'stat': 'level',
            'target': webgl_characters.test_character_0,
          },
          'expect': function(result){
              return webgl_characters.test_character_0.level === 2;
          },
          'function': 'webgl_stat_modify',
        },
        {
          'args': {
            'colors': [
              0,
              1,
              0,
              1,
            ],
            'vertexcount': 2,
          },
          'expect': [
            0,
            1,
            0,
            1,
            0,
            1,
            0,
            1,
          ],
          'function': 'webgl_vertexcolorarray',
        },
      ],
    });
}
</script>
