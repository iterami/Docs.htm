<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=0" name=viewport>
<title>Canvas Tests</title>
<link href=../../common/css/core.css rel=stylesheet>
<script src=../../common/js/core.js></script>
<script src=../../common/js/canvas.js></script>
<script src=../../common/js/entity.js></script>
<script>
function repo_drawlogic(){
    const half_x = globalThis.innerWidth / 2;
    const half_y = globalThis.innerHeight / 2;

    canvas_setproperties({
      'fillStyle': '#206620',
    });
    canvas.fillRect(
      half_x - 10 - camera_x,
      half_y - 10 - camera_y,
      20,
      20
    );
}

function repo_escape(){
    core_elements.repo_ui.style.display = 'inline';
}

function repo_init(){
    core_repo_init({
      'events': {
        'reset_camera': {
          'onclick': reset_camera,
        },
      },
      'globals': {
        'camera_x': 0,
        'camera_y': 0,
      },
      'pointerbinds': {
        'contextmenu': {
          'preventDefault': true,
        },
        'pointermove': {
          'todo': function(){
              if(core_pointer.down_0){
                  camera_x -= core_pointer.movement_x;
                  camera_y -= core_pointer.movement_y;
              }
          },
        },
      },
      'root': 'index.htm',
      'storage_controls': true,
      'title': 'Docs.htm',
      'ui': '<button id=reset_camera type=button>Reset Camera</button><table><tr><td>Camera X<td id=camera_x><tr><td>Camera Y<td id=camera_y><tr><td>x<td id=x><tr><td>y<td id=y><tr><td>down_x<td id=down_x><tr><td>down_y<td id=down_y><tr><td>movement_x<td id=movement_x><tr><td>movement_y<td id=movement_y><tr><td>down_0<td id=down_0><tr><td>down_1<td id=down_1><tr><td>down_2<td id=down_2><tr><td>down_3<td id=down_3><tr><td>down_4<td id=down_4><tr><td>core_mobile<td id=core_mobile></table><span id=todo style="display:none"></span>',
    });
    canvas_init();
}

function repo_logic(){
    if(core_keys[core_storage_data.move_down].state){
        camera_y += 10;
    }
    if(core_keys[core_storage_data.move_left].state){
        camera_x -= 10;
    }
    if(core_keys[core_storage_data.move_right].state){
        camera_x += 10;
    }
    if(core_keys[core_storage_data.move_up].state){
        camera_y -= 10;
    }

    core_ui_update({
      'ids': {
        'camera_x': camera_x,
        'camera_y': camera_y,
        'core_mobile': core_mobile,
        ...core_pointer,
      },
    });
}

function reset_camera(){
    camera_x = 0;
    camera_y = 0;
}
</script>
