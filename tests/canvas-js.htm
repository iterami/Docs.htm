<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=0" name=viewport>
<title>Canvas Tests</title>
<link href=../../common/css/core.css rel=stylesheet>
<style>
#selectable{
    background-color: #222;
    bottom: 0;
    height: 150px;
    position: fixed;
    right: 0;
    width: 300px;
    z-index: 8;
}
</style>

<div id=selectable>
  Selectable<br>Text<br><br>
  <input type=text value="Selectable Input"><br><br>
  <button>Selectable Button</button>
</div>

<script src=../../common/js/core.js></script>
<script src=../../common/js/canvas.js></script>
<script src=../../common/js/entity.js></script>
<script>
function repo_drawlogic(){
    const half_x = globalThis.innerWidth / 2;
    const half_y = globalThis.innerHeight / 2;

    canvas.save();
    canvas.translate(
      half_x - camera_x,
      half_y - camera_y
    );
    canvas.rotate(rotation);
    canvas.fillRect(-25, -25, 50, 50);
    canvas.restore();
}

function repo_escape(){
    core_elements.repo_ui.style.display = 'inline';
}

function repo_init(){
    core_repo_init({
      'events': {
        'reset_camera': {
          'onclick': reset_camera,
        },
      },
      'globals': {
        'camera_x': 0,
        'camera_y': 0,
        'fps_draw': 0,
        'fps_draw_time': 0,
        'fps_logic': 0,
        'rotation': 0,
      },
      'pointerbinds': {
        'contextmenu': {},
        'pointermove': {
          'todo': function(){
              if(core_pointer.down_0){
                  camera_x -= core_pointer.movement_x;
                  camera_y -= core_pointer.movement_y;
              }
          },
        },
      },
      'root': 'index.htm',
      'storage_controls': true,
      'title': 'Docs.htm',
      'ui': '<button id=reset_camera type=button>Reset Camera</button><table><tr><td>Draw FPS<td id=fps_draw><tr><td>Logic FPS<td id=fps_logic><tr><td>Camera X<td id=camera_x><tr><td>Camera Y<td id=camera_y><tr><td>x<td id=x><tr><td>y<td id=y><tr><td>down_x<td id=down_x><tr><td>down_y<td id=down_y><tr><td>movement_x<td id=movement_x><tr><td>movement_y<td id=movement_y><tr><td>down_0<td id=down_0><tr><td>down_1<td id=down_1><tr><td>down_2<td id=down_2><tr><td>down_3<td id=down_3><tr><td>down_4<td id=down_4><tr><td>core_mobile<td id=core_mobile></table><span id=todo style="display:none"></span>',
    });
    globalThis.canvas_drawloop = function(){
        canvas_draw();
        core_interval_animationFrame('canvas_drawloop');
        fps_draw = Math.trunc(1000 / (new Date().getTime() - fps_draw_time));
        fps_draw_time = new Date().getTime();
    };
    canvas_init();
    canvas_setproperties({
      'fillStyle': '#206620',
    });
}

function repo_logic(){
    rotation += Math.PI / 180;
    if(rotation >= Math.PI * 2){
        rotation = 0;
    }

    if(core_keys[core_storage_data.move_down].state){
        camera_y += 5;
    }
    if(core_keys[core_storage_data.move_left].state){
        camera_x -= 5;
    }
    if(core_keys[core_storage_data.move_right].state){
        camera_x += 5;
    }
    if(core_keys[core_storage_data.move_up].state){
        camera_y -= 5;
    }

    core_ui_update({
      'ids': {
        'camera_x': camera_x,
        'camera_y': camera_y,
        'core_mobile': core_mobile,
        'fps_draw': fps_draw,
        'fps_logic': Math.trunc(1000 / (new Date().getTime() - fps_logic)),
        ...core_pointer,
      },
    });
    fps_logic = new Date().getTime();
}

function reset_camera(){
    camera_x = 0;
    camera_y = 0;
}
</script>
