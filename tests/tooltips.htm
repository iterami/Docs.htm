<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Tooltip Tests</title>
<link href=../../common/css/core.css rel=stylesheet>
<style>
#button{
    position: fixed;
}
.tooltip{
    background: #111;
    border: 1px solid #aaa;
    display: none;
    padding: 9px;
    position: fixed;
    text-align: left;
    width: max-content;
}
</style>

<button class=big id=button>Tooltip<br>Test Button</button>
<div class=tooltip id=tooltip></div>

<script src=../../common/js/core.js></script>
<script>
function repo_init(){
    core_repo_init({
      'events': {
        'update': {
          'onclick': update_button,
        },
      },
      'globals': {
        'tooltips': {
          'button': '<div>Example Real Tooltip</div><div>This is a real tooltip example!</div>',
        },
      },
      'info': '<div class=tooltip style=display:block;position:static><div>Example Tooltip Design</div><div>This is some example tooltip text.</div></div>'
        + '<button id=update type=button>Update Button Position</button>',
      'menu': true,
      'root': 'index.htm',
      'storage': {
        'button_x': '0px',
        'button_y': '300px',
      },
      'storage_menu': '<table><tr><td><input class=mini id=button_x type=text><td>Button X'
        + '<tr><td><input class=mini id=button_y type=text><td>Button Y</table>',
      'title': 'Docs.htm',
      'ui_elements': [
        'button',
        'tooltip',
      ],
    });

    tooltip_init();
    update_button();
}

function tooltip_hide(event){
    core_elements.tooltip.style.display = 'none';
    core_elements.tooltip.innerHTML = '';
}

function tooltip_init(){
    for(const tooltip in tooltips){
        core_elements[tooltip].onmouseenter = tooltip_show;
        core_elements[tooltip].onmouseleave = tooltip_hide;
        core_elements[tooltip].onpointerdown = tooltip_toggle;
    }
}

function tooltip_show(event){
    if(!tooltips[event.target.id]){
        return;
    }
    core_elements.tooltip.innerHTML = tooltips[event.target.id];

    const left = Math.max(
      event.target.offsetLeft - event.target.scrollLeft,
      0
    );
    if(left + core_elements.tooltip.offsetWidth > globalThis.innerWidth){
        core_elements.tooltip.style.left = 'auto';
        core_elements.tooltip.style.right = 0;

    }else{
        core_elements.tooltip.style.left = left + 'px';
        core_elements.tooltip.style.right = 'auto';
    }

    const top = Math.max(
      event.target.offsetTop - event.target.scrollTop + event.target.offsetHeight,
      0
    );
    if(top + core_elements.tooltip.offsetHeight > globalThis.innerHeight){
        core_elements.tooltip.style.bottom = Math.abs(event.target.offsetTop - event.target.scrollTop - globalThis.innerHeight) + 'px';
        core_elements.tooltip.style.top = 'auto';

    }else{
        core_elements.tooltip.style.bottom = 'auto';
        core_elements.tooltip.style.top = top + 'px';
    }

    core_elements.tooltip.style.display = 'block';
}

function tooltip_toggle(event){
    if(core_elements.tooltip.style.display === 'block'){
        tooltip_hide(event);

    }else{
        tooltip_show(event);
    }
}

function update_button(){
    core_elements.button.style.left = core_storage_data.button_x;
    core_elements.button.style.top = core_storage_data.button_y;
}
</script>
