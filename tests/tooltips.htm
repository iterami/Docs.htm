<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Tooltip Tests</title>
<link href=../../common/css/core.css rel=stylesheet>
<style>
body{
    text-align: left;
}
#button{
    position: relative;
}
.tooltip{
    background: #111;
    border: 2px solid #aaa;
    display: none;
    padding: .3rem;
    position: fixed;
    text-align: left;
    width: max-content;
}
</style>

<div class=tooltip style=display:block>
  <div>Example Tooltip Design</div>
  <div>This is some example tooltip text.</div>
</div>
<button class=big id=button>Tooltip<br>Button</button>
<div class=tooltip id=tooltip></div>

<script src=../../common/js/core.js></script>
<script>
function repo_init(){
    core_repo_init({
      'globals': {
        'tooltips': {
          'button': '<div>Example Real Tooltip</div><div>This is a real tooltip example!</div>',
        },
      },
      'pointerbinds': {
        'pointermove': {
          'todo': function(event){
              if(core_pointer.down_0){
                  const button = core_elements.button.getBoundingClientRect();
                  core_elements.button.style.left = (core_pointer.x - button.width / 2) + 'px';
                  core_elements.button.style.top = (core_pointer.y - button.height) + 'px';
              }
          },
        },
      },
      'root': 'index.htm',
      'title': 'Docs.htm',
      'ui_elements': [
        'button',
        'tooltip',
      ],
    });

    tooltip_init();
}

function tooltip_hide(event){
    const element = core_elements.tooltip;
    element.style.display = 'none';
    element.innerHTML = '';
}

function tooltip_init(){
    for(const tooltip in tooltips){
        core_elements[tooltip].onmouseenter = tooltip_show;
        core_elements[tooltip].onmouseleave = tooltip_hide;
        core_elements[tooltip].onpointerdown = tooltip_toggle;
    }
}

function tooltip_show(event){
    if(!tooltips[event.target.id]){
        return;
    }
    const element = core_elements.tooltip;
    element.innerHTML = tooltips[event.target.id];
    const style = element.style;
    style.display = 'block';

    const target = event.target.getBoundingClientRect();
    const tooltip = element.getBoundingClientRect();

    const left = Math.max(0, target.left);
    if(left + tooltip.width > globalThis.innerWidth){
        style.left = 'auto';
        style.right = 0;

    }else{
        style.left = left + 'px';
        style.right = 'auto';
    }

    const top = Math.max(0, target.top + target.height);
    if(top + tooltip.height > globalThis.innerHeight){
        style.bottom = (globalThis.innerHeight - target.top) + 'px';
        style.top = 'auto';

    }else{
        style.bottom = 'auto';
        style.top = top + 'px';
    }
}

function tooltip_toggle(event){
    if(core_elements.tooltip.style.display === 'block'){
        tooltip_hide(event);

    }else{
        tooltip_show(event);
    }
}
</script>
